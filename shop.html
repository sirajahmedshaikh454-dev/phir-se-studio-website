<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | Phir Se Studio</title>
<meta name="description" content="Patchwork bags, cushions, throws and table linen made from offcuts.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Instrument+Sans:wght@400..700&family=Noto+Nastaliq+Urdu:wght@400..700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<noscript><style>.pt,.pre{display:none}.rv{opacity:1;transform:none}</style></noscript>
</head>
<body>
<main>

<section class="ph"><span class="eyebrow">The collection</span><h1 data-split style="margin-top:14px">Every piece, <em>one of one</em></h1><p>Bags, cushions, throws and table linen, stitched in Faisalabad from export-factory offcuts.</p></section>
<div class="shop-bar" role="search">
  <div class="chips" id="chips" aria-label="Categories"></div>
  <span class="sp"></span>
  <label class="fld"><span id="srch-ic"></span><span class="sr" style="position:absolute;left:-9999px">Search products</span><input id="q" type="search" placeholder="Search" autocomplete="off"></label>
  <label class="range">Up to <b id="pv">PKR 8,000</b><input id="pr" type="range" min="500" max="8000" step="100" value="8000" aria-label="Maximum price"></label>
  <label class="fld"><span class="sr" style="position:absolute;left:-9999px">Sort</span><select id="sort"><option value="feat">Featured</option><option value="pa">Price: low to high</option><option value="pd">Price: high to low</option><option value="kg">Most fabric saved</option></select></label>
</div>
<section class="wrap" style="padding-top:34px;min-height:70vh">
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid-p" id="grid" style="margin-top:22px"></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js"></script>
<script src="js/data.js"></script><script src="js/art.js"></script><script src="js/main.js"></script>
<script src="js/shop.js"></script>
</body>
</html>

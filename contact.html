<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Phir Se Studio</title>
<meta name="description" content="Visit the Faisalabad studio, message us or book a pop-up visit.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Instrument+Sans:wght@400..700&family=Noto+Nastaliq+Urdu:wght@400..700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<noscript><style>.pt,.pre{display:none}.rv{opacity:1;transform:none}</style></noscript>
</head>
<body>
<main>

<section class="ph"><span class="eyebrow">Say hello</span><h1 data-split style="margin-top:14px">Come by the <em>studio</em></h1><p>Questions, custom orders or a visit to the workshop? Write to us and we will reply within a working day. (Demo details.)</p></section>
<section class="ct">
  <div><ul class="info" id="info"></ul><div class="map" id="map"></div></div>
  <div class="panel" style="margin:0"><h3>Send a message</h3><form id="cf" novalidate style="margin-top:16px">
    <div class="g2"><label class="field"><span>Your name</span><input name="nm" autocomplete="name"><em class="em">Please enter your name</em></label><label class="field"><span>Email</span><input name="em" type="email" autocomplete="email"><em class="em">Enter a valid email</em></label></div>
    <label class="field"><span>Topic</span><select name="tp"><option value="">Choose a topic</option><option>Order question</option><option>Custom or Memory Throw</option><option>Café or corporate order</option><option>Studio visit or workshop</option><option>Something else</option></select><em class="em">Please choose a topic</em></label>
    <label class="field"><span>Message</span><textarea name="ms" rows="5"></textarea><em class="em">Please write a short message</em></label>
    <button class="btn" type="submit" id="cb" style="width:100%;justify-content:center">Send message</button></form></div>
</section>
<section class="sec wrap"><div class="split" style="align-items:start"><div><span class="eyebrow">Pop-ups and workshops</span><h2 data-split style="margin:14px 0 24px">Meet us in <em>person</em></h2><div id="events"></div></div>
<div><span class="eyebrow">Good to know</span><h2 data-split style="margin:14px 0 24px">Questions we <em>hear often</em></h2><div class="acc" id="faq" style="margin-top:0"></div></div></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js"></script>
<script src="js/data.js"></script><script src="js/art.js"></script><script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
